<!DOCTYPE html>

<html class="dark" lang="en"><head>

                    "surface-variant": "#273647",
                    "on-surface": "#d4e4fa",
                    "on-secondary": "#00363f",
                    "tertiary-fixed-dim": "#c3c6d7",
                    "surface-container-low": "#0d1c2d",
                    "surface-tint": "#acc7ff",
                    "secondary-container": "#00c2de",

                    "on-background": "#d4e4fa",

                    "surface-dim": "#051424",
                    "primary-fixed-dim": "#acc7ff",

                    "on-tertiary-fixed": "#171b28",

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(79, 142, 247, 0.05) 100%);
            pointer-events: none;
        }

        .input-glass {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-glass:focus {
            border-color: #508ff8;
            background: rgba(0, 0, 0, 0.4);
            outline: none;
            box-shadow: 0 0 0 2px rgba(80, 143, 248, 0.2);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .btn-primary-gradient {
            background: #4F8EF7;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary-gradient:active {
            transform: scale(0.96);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-gradient-to-br from-surface-container-lowest to-background"></div>
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/10 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary/5 blur-[120px]"></div>
</div>
<header class="relative z-10 pt-12 pb-8 px-container-padding flex flex-col items-center">
<div class="w-16 h-16 rounded-xl glass-card flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">
                trending_up
            </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">Create Account</h1>
<p class="font-body-md text-on-surface-variant mt-2">Start your journey to financial freedom</p>
</header>
<main class="relative z-10 px-container-padding flex-1 flex flex-col max-w-md mx-auto w-full pb-12">
<div class="glass-card rounded-[24px] p-6 shadow-2xl">
<form class="space-y-5" id="registerForm">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
<input class="input-glass w-full h-[56px] rounded-xl pl-12 pr-4 text-on-surface font-body-md placeholder:text-outline-variant" id="fullName" placeholder="John Doe" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="input-glass w-full h-[56px] rounded-xl pl-12 pr-4 text-on-surface font-body-md placeholder:text-outline-variant" id="email" placeholder="john@example.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="input-glass w-full h-[56px] rounded-xl pl-12 pr-12 text-on-surface font-body-md placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock_reset</span>
<input class="input-glass w-full h-[56px] rounded-xl pl-12 pr-12 text-on-surface font-body-md placeholder:text-outline-variant" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-4">
<button class="btn-primary-gradient w-full h-[56px] rounded-[16px] text-on-primary font-headline-md text-headline-md shadow-[0_8px_24px_rgba(80,143,248,0.3)]" type="submit">
                        Create Account
                    </button>
</div>
</form>
<div class="mt-8 pt-8 border-t border-white/5 flex flex-col items-center gap-4">
<p class="font-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-label-md hover:underline transition-all" href="#">Login</a>
</p>
</div>
</div>
<div class="mt-8 text-center px-4">
<p class="text-label-sm font-label-sm text-outline-variant leading-relaxed">
                By creating an account, you agree to our <br/>
<span class="text-on-surface-variant">Terms of Service</span> and <span class="text-on-surface-variant">Privacy Policy</span>.
            </p>
</div>
</main>
<div class="mt-auto h-8 shrink-0"></div>
<script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `
                <div class="flex items-center justify-center gap-2">
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Setting up...</span>
                </div>
            `;
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }, 2000);
        });

        document.querySelectorAll('.input-glass').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.material-symbols-outlined').style.color = '#acc7ff';
            });
            input.addEventListener('blur', function() {
                this.parentElement.querySelector('.material-symbols-outlined').style.color = '#8c909e';
            });
        });
    </script>
</body></html>
