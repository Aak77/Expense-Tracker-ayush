<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#dfe2f3",
                        "surface-container-high": "#1c2b3c",
                        "tertiary-container": "#8d90a0",
                        "on-primary-fixed-variant": "#004492",
                        "secondary-fixed": "#a7eeff",
                        "outline": "#8c909e",
                        "outline-variant": "#424753",
                        "error-container": "#93000a",
                        "on-secondary-fixed-variant": "#004e5b",
                        "on-secondary-container": "#004b57",
                        "primary-container": "#508ff8",
                        "on-error": "#690005",
                        "on-tertiary": "#2c303d",
                        "surface-variant": "#273647",
                        "on-surface": "#d4e4fa",
                        "on-secondary": "#00363f",
                        "tertiary-fixed-dim": "#c3c6d7",
                        "surface-container-low": "#0d1c2d",
                        "surface-tint": "#acc7ff",
                        "secondary-container": "#00c2de",
                        "on-surface-variant": "#c2c6d5",
                        "on-primary": "#002f68",
                        "on-primary-container": "#00285b",
                        "surface-container-highest": "#273647",
                        "surface-container": "#122131",
                        "tertiary": "#c3c6d7",
                        "primary": "#acc7ff",
                        "surface-bright": "#2c3a4c",
                        "primary-fixed": "#d7e2ff",
                        "secondary-fixed-dim": "#3ad8f5",
                        "on-secondary-fixed": "#001f25",
                        "surface": "#051424",
                        "inverse-on-surface": "#233143",
                        "secondary": "#43defb",
                        "inverse-surface": "#d4e4fa",
                        "on-tertiary-fixed-variant": "#434654",
                        "on-error-container": "#ffdad6",
                        "on-background": "#d4e4fa",
                        "on-tertiary-container": "#252936",
                        "surface-dim": "#051424",
                        "primary-fixed-dim": "#acc7ff",
                        "surface-container-lowest": "#010f1f",
                        "on-tertiary-fixed": "#171b28",
                        "on-primary-fixed": "#001a40",
                        "background": "#051424",
                        "inverse-primary": "#005bbf",
                        "error": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "base": "4px",
                        "xs": "4px",
                        "container-padding": "20px",
                        "md": "16px",
                        "xl": "32px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-currency": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "display-currency": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #051424;
            color: #d4e4fa;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid transparent;
            border-image: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(79, 142, 247, 0.05) 100%) 1;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .primary-button {
            background-color: #4F8EF7;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .primary-button:active {
            transform: scale(0.95);
        }

        .input-field:focus-within {
            border-color: #4F8EF7;
            box-shadow: 0 0 0 1px #4F8EF7;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col justify-center items-center relative p-container-padding">
<!-- Atmospheric Background Shader -->
<div class="fixed inset-0 -z-10 overflow-hidden">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,_rgba(79,142,247,0.1)_0%,_transparent_50%)]"></div>
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/10 rounded-full blur-[120px]"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-md animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Brand Identity -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 rounded-2xl bg-primary-container flex items-center justify-center mb-6 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary-container text-[40px]" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface tracking-tight">FinTrack</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Manage your wealth with precision</p>
</div>
<!-- Login Form Card -->
<div class="glass-card rounded-xl p-8 mb-8">
<form class="space-y-6" id="loginForm">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email</label>
<div class="input-field relative flex items-center bg-surface-container-lowest/50 border border-outline-variant rounded-lg transition-all duration-200">
<span class="material-symbols-outlined absolute left-4 text-outline text-md">mail</span>
<input class="w-full bg-transparent border-none text-on-surface font-body-md py-4 pl-12 pr-4 focus:ring-0 placeholder:text-outline/50" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-secondary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="input-field relative flex items-center bg-surface-container-lowest/50 border border-outline-variant rounded-lg transition-all duration-200">
<span class="material-symbols-outlined absolute left-4 text-outline text-md">lock</span>
<input class="w-full bg-transparent border-none text-on-surface font-body-md py-4 pl-12 pr-12 focus:ring-0 placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-md" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="primary-button w-full py-4 rounded-xl text-on-primary font-headline-md shadow-lg shadow-primary/10 flex justify-center items-center gap-2 group" type="submit">
                    Login
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
</div>
<!-- Secondary Actions -->
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-secondary ml-1 hover:underline underline-offset-4" href="#">Register</a>
</p>
</div>
</main>
<!-- Visual Polish Elements -->
<div class="fixed bottom-12 w-full flex justify-center opacity-30 pointer-events-none">
<div class="flex items-center gap-8">
<div class="h-[1px] w-12 bg-outline-variant"></div>
<div class="font-label-sm text-label-sm tracking-widest uppercase">SECURE ENCRYPTION</div>
<div class="h-[1px] w-12 bg-outline-variant"></div>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }

        // Mock interaction for visual feedback
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined">progress_activity</span> Authenticating...';
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 2000);
        });
    </script>
</body></html>
