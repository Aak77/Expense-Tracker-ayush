<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Savings Goal | FinTrack</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 1px solid transparent;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(79,142,247,0.05) 100%) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            pointer-events: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            outline: none;
            border-color: #4F8EF7 !important;
            box-shadow: 0 0 0 2px rgba(79,142,247,0.2);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-fixed": "#dfe2f3",
                      "surface-container-high": "#1c2b3c",
                      "tertiary-container": "#8d90a0",
                      "on-primary-fixed-variant": "#004492",
                      "secondary-fixed": "#a7eeff",
                      "outline": "#8c909e",
                      "outline-variant": "#424753",
                      "error-container": "#93000a",
                      "on-secondary-fixed-variant": "#004e5b",
                      "on-secondary-container": "#004b57",
                      "primary-container": "#508ff8",
                      "on-error": "#690005",
                      "on-tertiary": "#2c303d",
                      "surface-variant": "#273647",
                      "on-surface": "#d4e4fa",
                      "on-secondary": "#00363f",
                      "tertiary-fixed-dim": "#c3c6d7",
                      "surface-container-low": "#0d1c2d",
                      "surface-tint": "#acc7ff",
                      "secondary-container": "#00c2de",
                      "on-surface-variant": "#c2c6d5",
                      "on-primary": "#002f68",
                      "on-primary-container": "#00285b",
                      "surface-container-highest": "#273647",
                      "surface-container": "#122131",
                      "tertiary": "#c3c6d7",
                      "primary": "#acc7ff",
                      "surface-bright": "#2c3a4c",
                      "primary-fixed": "#d7e2ff",
                      "secondary-fixed-dim": "#3ad8f5",
                      "on-secondary-fixed": "#001f25",
                      "surface": "#051424",
                      "inverse-on-surface": "#233143",
                      "secondary": "#43defb",
                      "inverse-surface": "#d4e4fa",
                      "on-tertiary-fixed-variant": "#434654",
                      "on-error-container": "#ffdad6",
                      "on-background": "#d4e4fa",
                      "on-tertiary-container": "#252936",
                      "surface-dim": "#051424",
                      "primary-fixed-dim": "#acc7ff",
                      "surface-container-lowest": "#010f1f",
                      "on-tertiary-fixed": "#171b28",
                      "on-primary-fixed": "#001a40",
                      "background": "#051424",
                      "inverse-primary": "#005bbf",
                      "error": "#ffb4ab"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "sm": "8px",
                      "base": "4px",
                      "xs": "4px",
                      "container-padding": "20px",
                      "md": "16px",
                      "xl": "32px",
                      "lg": "24px"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "headline-md": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "label-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-sm": ["Inter"],
                      "display-currency": ["Inter"]
              },
              "fontSize": {
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "display-currency": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden">
<!-- Top AppBar (Task-Focused: No SideNav/BottomNav as per instructions) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding h-16 bg-surface/80 backdrop-blur-xl border-b border-white/10">
<div class="flex items-center gap-md">
<button class="p-2 -ml-2 rounded-full hover:bg-white/5 active:scale-95 duration-200" onclick="history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary">Edit Savings Goal</h1>
</div>
<div class="flex items-center gap-md">
<button class="p-2 rounded-full hover:bg-white/5 active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary">delete</span>
</button>
</div>
</header>
<main class="pt-24 pb-12 px-container-padding flex flex-col items-center">
<!-- Visual Atmosphere -->
<div class="absolute top-0 left-0 w-full h-[353px] opacity-30 pointer-events-none">

</div>
<div class="w-full max-w-lg relative z-10">
<!-- Summary Card -->
<div class="glass-card rounded-xl p-lg mb-xl animate-in fade-in slide-in-from-bottom-4 duration-500">
<div class="flex items-center justify-between mb-md">
<div class="p-3 bg-primary/10 rounded-full">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">ads_click</span>
</div>
<div class="text-right">
<p class="text-label-sm font-label-sm text-outline uppercase">Progress</p>
<p class="text-headline-md font-headline-md text-secondary">65%</p>
</div>
</div>
<div class="h-2 w-full bg-white/5 rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-primary to-secondary w-[65%]"></div>
</div>
</div>
<!-- Form Content -->
<form class="space-y-lg">
<!-- Goal Name -->
<div class="space-y-sm">
<label class="text-label-md font-label-md text-on-surface-variant px-1" for="goal_name">Goal Name</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container rounded-xl border border-white/10 px-lg text-body-md text-on-surface focus:ring-0 transition-all placeholder:text-outline/50" id="goal_name" placeholder="What are you saving for?" type="text" value="New Tesla Model 3"/>
<span class="material-symbols-outlined absolute right-lg top-1/2 -translate-y-1/2 text-outline">edit</span>
</div>
</div>
<!-- Bento Grid for Amounts -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Target Amount -->
<div class="space-y-sm">
<label class="text-label-md font-label-md text-on-surface-variant px-1" for="target_amount">Target Amount (₹)</label>
<div class="relative">
<span class="absolute left-lg top-1/2 -translate-y-1/2 text-primary font-bold">₹</span>
<input class="w-full h-14 bg-surface-container rounded-xl border border-white/10 pl-10 pr-lg text-body-md text-on-surface focus:ring-0 transition-all" id="target_amount" placeholder="0.00" type="number" value="4500000"/>
</div>
</div>
<!-- Current Amount -->
<div class="space-y-sm">
<label class="text-label-md font-label-md text-on-surface-variant px-1" for="current_amount">Current Amount (₹)</label>
<div class="relative">
<span class="absolute left-lg top-1/2 -translate-y-1/2 text-secondary font-bold">₹</span>
<input class="w-full h-14 bg-surface-container rounded-xl border border-white/10 pl-10 pr-lg text-body-md text-on-surface focus:ring-0 transition-all" id="current_amount" placeholder="0.00" type="number" value="2925000"/>
</div>
</div>
</div>
<!-- Target Date -->
<div class="space-y-sm">
<label class="text-label-md font-label-md text-on-surface-variant px-1" for="target_date">Target Date</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container rounded-xl border border-white/10 px-lg text-body-md text-on-surface focus:ring-0 transition-all [color-scheme:dark]" id="target_date" type="date" value="2025-12-31"/>
<span class="material-symbols-outlined absolute right-lg top-1/2 -translate-y-1/2 text-outline pointer-events-none">calendar_today</span>
</div>
</div>
<!-- Dynamic Insight (Glass Card) -->
<div class="glass-card rounded-xl p-md border-primary/20 bg-primary/5 flex gap-md items-start">
<span class="material-symbols-outlined text-primary-container">info</span>
<p class="text-label-md font-label-md text-on-surface-variant leading-snug">
                        To reach your goal by Dec 2025, you'll need to save approximately <span class="text-primary font-bold">₹82,895</span> per month.
                    </p>
</div>
<!-- Save Button -->
<div class="pt-xl">
<button class="w-full h-14 bg-primary-container text-on-primary-container font-headline-md rounded-full shadow-lg shadow-primary-container/20 hover:brightness-110 active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-sm" type="submit">
                        Save Goal
                        <span class="material-symbols-outlined">check_circle</span>
</button>
<p class="text-center text-label-sm text-outline mt-lg">All data is encrypted and stored securely.</p>
</div>
</form>
</div>
</main>
<!-- Visual Decoration (Floating Orb) -->
<div class="fixed -bottom-32 -left-32 w-64 h-64 bg-secondary/10 blur-[100px] rounded-full"></div>
<div class="fixed -top-32 -right-32 w-64 h-64 bg-primary/10 blur-[100px] rounded-full"></div>
<script>
        // Micro-interactions for form feedback
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.closest('.space-y-sm').classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.closest('.space-y-sm').classList.remove('scale-[1.01]');
            });
        });

        // Simple form submission prevention for demo
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Updating...';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">done_all</span> Goal Updated!';
                btn.classList.replace('bg-primary-container', 'bg-secondary-container');
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-secondary-container', 'bg-primary-container');
                    btn.classList.remove('opacity-80');
                }, 2000);
            }, 1000);
        });
    </script>
</body></html>
