                    "primary": "#acc7ff",

                    "primary-fixed": "#d7e2ff",

                    "surface": "#051424",

                    "secondary": "#43defb",
                    "inverse-surface": "#d4e4fa",
                    "on-tertiary-fixed-variant": "#434654",
                    "on-error-container": "#ffdad6",
                    "on-background": "#d4e4fa",
                    "on-tertiary-container": "#252936",

<style>
        body {
            background-color: #051424;
            color: #d4e4fa;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(79, 142, 247, 0.05) 100%);
            pointer-events: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input-focus:focus {
            border-color: #4F8EF7;
            box-shadow: 0 0 0 2px rgba(79, 142, 247, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-start">
<!-- Top App Bar (Task-Focused: No leading avatar, but a Close action) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding h-16 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-white/10">
<button aria-label="Go back" class="flex items-center justify-center p-2 hover:bg-white/5 rounded-full transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary">Edit Profile</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="w-full max-w-md mt-24 px-container-padding pb-32 flex flex-col items-center">
<!-- Avatar Section -->
<div class="relative group mb-xl">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-surface-container-high relative">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional headshot of a middle-aged man with a clean beard and a confident smile. He is set against a dark, moody studio background with subtle blue rim lighting that highlights the contours of his face and suit. The visual style is premium and high-fidelity, echoing a corporate yet modern fintech aesthetic with deep navy and electric blue tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBq6yo3wqGMtInxdGonJLLjNck07jHvMNU7EcAcOSx3c0xeD6apwz8dEknRLgDeLruMJVN7_j_8Cfn1xxinhyRhZwCasMx6WZeoT4ofTsQXAz8ptLRAFy2Ewv2k64TF6YpT6dh9Edg6o0jsGhrdGuFFseDCOTO5qohEJnpA_qg33vF6BmUCCrNPh0ACOHaS5VQ_VD9EfKUTNYEE9l28SMRUWMovTwnChQKggOwG1GeLZMb2OSTrPOSWXw4OYQ4YTyd0fbmNfJ8un8Y8"/>
<!-- Edit Overlay -->
<button class="absolute inset-0 bg-black/40 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-white text-3xl mb-1">photo_camera</span>
<span class="text-label-sm font-label-sm text-white uppercase tracking-widest">Change</span>
</button>
</div>
<!-- FAB-like button for mobile tap -->
<button class="absolute bottom-1 right-1 bg-primary text-on-primary w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform md:hidden">
<span class="material-symbols-outlined" style="font-variation-settings: 'opsz' 20">edit</span>
</button>
</div>
<!-- Form Section -->
<div class="w-full glass-card rounded-xl p-lg flex flex-col gap-lg">
<div class="flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface-variant px-1" for="full_name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl">person</span>
<input class="w-full bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg py-4 pl-12 pr-4 font-body-md text-body-md focus:outline-none focus:border-primary-container transition-all form-input-focus" id="full_name" placeholder="Enter your full name" type="text" value="Alexander Mitchell"/>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface-variant px-1" for="email_address">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl">mail</span>
<input class="w-full bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg py-4 pl-12 pr-4 font-body-md text-body-md focus:outline-none focus:border-primary-container transition-all form-input-focus" id="email_address" placeholder="name@example.com" type="email" value="a.mitchell@fintrack.io"/>
</div>
</div>
<div class="mt-4 p-md rounded-lg bg-surface-container-low border border-white/5">
<div class="flex items-start gap-sm">
<span class="material-symbols-outlined text-secondary text-xl">verified_user</span>
<div>
<p class="text-label-md font-label-md text-on-surface">Account Security</p>
<p class="text-label-sm font-label-sm text-outline">Your identity is verified via biometrics and 2FA. Changing your email will trigger a security alert.</p>
</div>
</div>
</div>
</div>
<!-- Action Button -->
<div class="w-full mt-xl">
<button class="w-full h-14 bg-primary-container text-on-primary-container rounded-xl font-headline-md text-headline-md shadow-lg shadow-primary-container/20 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-sm">
<span>Save Changes</span>
<span class="material-symbols-outlined">check_circle</span>
</button>
<button class="w-full mt-md h-12 bg-transparent text-outline font-label-md text-label-md rounded-xl hover:bg-white/5 active:scale-95 transition-all">
                Discard Changes
            </button>
</div>
</main>
<!-- Background Elements -->
<div class="fixed inset-0 -z-10 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[20%] right-[-10%] w-[30%] h-[30%] bg-secondary/5 blur-[100px] rounded-full"></div>
</div>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#acc7ff';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#8c909e';
            });
        });

        // Simulate Save Action
        const saveBtn = document.querySelector('button.bg-primary-container');
        saveBtn.addEventListener('click', () => {
            const originalContent = saveBtn.innerHTML;
            saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
            saveBtn.disabled = true;
            
            setTimeout(() => {
                saveBtn.innerHTML = '<span class="material-symbols-outlined">done</span><span>Saved!</span>';
                saveBtn.classList.replace('bg-primary-container', 'bg-green-500');
                
                setTimeout(() => {
                    saveBtn.innerHTML = originalContent;
                    saveBtn.classList.replace('bg-green-500', 'bg-primary-container');
                    saveBtn.disabled = false;
                }, 2000);
            }, 1200);
        });
    </script>
</body></html>
