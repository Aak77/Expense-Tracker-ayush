<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #051424;
      color: #d4e4fa;
      -webkit-font-smoothing: antialiased;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top-color: rgba(255, 255, 255, 0.15);
      border-left-color: rgba(255, 255, 255, 0.15);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "tertiary-fixed": "#dfe2f3",
            "surface-container-high": "#1c2b3c",
            "tertiary-container": "#8d90a0",
            "on-primary-fixed-variant": "#004492",
            "secondary-fixed": "#a7eeff",
            "outline": "#8c909e",
            "outline-variant": "#424753",
            "error-container": "#93000a",
            "on-secondary-fixed-variant": "#004e5b",
            "on-secondary-container": "#004b57",
            "primary-container": "#508ff8",
            "on-error": "#690005",
            "on-tertiary": "#2c303d",
            "surface-variant": "#273647",
            "on-surface": "#d4e4fa",
            "on-secondary": "#00363f",
            "tertiary-fixed-dim": "#c3c6d7",
            "surface-container-low": "#0d1c2d",
            "surface-tint": "#acc7ff",
            "secondary-container": "#00c2de",
            "on-surface-variant": "#c2c6d5",
            "on-primary": "#002f68",
            "on-primary-container": "#00285b",
            "surface-container-highest": "#273647",
            "surface-container": "#122131",
            "tertiary": "#c3c6d7",
            "primary": "#acc7ff",
            "surface-bright": "#2c3a4c",
            "primary-fixed": "#d7e2ff",
            "secondary-fixed-dim": "#3ad8f5",
            "on-secondary-fixed": "#001f25",
            "surface": "#051424",
            "inverse-on-surface": "#233143",
            "secondary": "#43defb",
            "inverse-surface": "#d4e4fa",
            "on-tertiary-fixed-variant": "#434654",
            "on-error-container": "#ffdad6",
            "on-background": "#d4e4fa",
            "on-tertiary-container": "#252936",
            "surface-dim": "#051424",
            "primary-fixed-dim": "#acc7ff",
            "surface-container-lowest": "#010f1f",
            "on-tertiary-fixed": "#171b28",
            "on-primary-fixed": "#001a40",
            "background": "#051424",
            "inverse-primary": "#005bbf",
            "error": "#ffb4ab"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "sm": "8px",
            "base": "4px",
            "xs": "4px",
            "container-padding": "20px",
            "md": "16px",
            "xl": "32px",
            "lg": "24px"
          },
          "fontFamily": {
            "body-md": ["Inter"],
            "headline-md": ["Inter"],
            "headline-lg-mobile": ["Inter"],
            "label-md": ["Inter"],
            "headline-lg": ["Inter"],
            "body-lg": ["Inter"],
            "label-sm": ["Inter"],
            "display-currency": ["Inter"]
          },
          "fontSize": {
            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
            "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
            "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
            "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
            "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
            "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
            "display-currency": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar: suppressed for focused journey, but using custom simplified header -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/10 px-container-padding h-16 flex justify-between items-center">
<button class="flex items-center justify-center h-10 w-10 rounded-full hover:bg-white/5 transition-colors" onclick="window.history.back()">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary">New Transaction</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 mt-16 px-container-padding pb-32 pt-8 overflow-y-auto">
<!-- Amount Input Section -->
<div class="flex flex-col items-center mb-10">
<div class="relative w-full text-center">
<span class="text-display-currency font-display-currency text-primary mb-2 block">₹</span>
<input autofocus="" class="w-full bg-transparent border-none text-center text-display-currency font-display-currency text-on-surface placeholder-on-surface/20 focus:ring-0 focus:outline-none" placeholder="0.00" step="0.01" type="number"/>
</div>
<!-- Type Toggle -->
<div class="mt-8 flex bg-surface-container rounded-full p-1 w-64 glass-card">
<button class="flex-1 py-2 px-4 rounded-full text-label-md font-label-md transition-all duration-300 bg-error-container text-on-error-container shadow-lg" id="toggle-expense">Expense</button>
<button class="flex-1 py-2 px-4 rounded-full text-label-md font-label-md transition-all duration-300 text-on-surface-variant hover:text-on-surface" id="toggle-income">Income</button>
</div>
</div>
<!-- Category Selector -->
<div class="mb-10">
<div class="flex justify-between items-center mb-4">
<span class="text-label-md font-label-md text-on-surface-variant">Category</span>
<span class="text-label-sm font-label-sm text-secondary">Manage</span>
</div>
<div class="flex gap-4 overflow-x-auto hide-scrollbar -mx-container-padding px-container-padding">
<button class="flex-shrink-0 flex flex-col items-center gap-2 group">
<div class="h-14 w-14 rounded-2xl bg-primary-container/20 border border-primary-container/30 flex items-center justify-center text-primary-container transition-all group-hover:scale-105 active:scale-95">
<span class="material-symbols-outlined">restaurant</span>
</div>
<span class="text-label-sm font-label-sm text-primary-container">Food</span>
</button>
<button class="flex-shrink-0 flex flex-col items-center gap-2 group">
<div class="h-14 w-14 rounded-2xl glass-card flex items-center justify-center text-on-surface-variant transition-all group-hover:bg-white/5">
<span class="material-symbols-outlined">commute</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Transport</span>
</button>
<button class="flex-shrink-0 flex flex-col items-center gap-2 group">
<div class="h-14 w-14 rounded-2xl glass-card flex items-center justify-center text-on-surface-variant transition-all group-hover:bg-white/5">
<span class="material-symbols-outlined">shopping_bag</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Shopping</span>
</button>
<button class="flex-shrink-0 flex flex-col items-center gap-2 group">
<div class="h-14 w-14 rounded-2xl glass-card flex items-center justify-center text-on-surface-variant transition-all group-hover:bg-white/5">
<span class="material-symbols-outlined">movie</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Leisure</span>
</button>
<button class="flex-shrink-0 flex flex-col items-center gap-2 group">
<div class="h-14 w-14 rounded-2xl glass-card flex items-center justify-center text-on-surface-variant transition-all group-hover:bg-white/5">
<span class="material-symbols-outlined">medical_services</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Health</span>
</button>
<button class="flex-shrink-0 flex flex-col items-center gap-2 group">
<div class="h-14 w-14 rounded-2xl glass-card flex items-center justify-center text-on-surface-variant transition-all group-hover:bg-white/5">
<span class="material-symbols-outlined">more_horiz</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Other</span>
</button>
</div>
</div>
<!-- Form Fields -->
<div class="space-y-6">
<div class="relative group">
<label class="block text-label-sm font-label-sm text-outline mb-2 ml-1">Description</label>
<div class="glass-card rounded-xl flex items-center px-4 py-3 group-focus-within:border-primary-container transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mr-3">notes</span>
<input class="bg-transparent border-none p-0 w-full text-body-md font-body-md text-on-surface placeholder-on-surface/30 focus:ring-0" placeholder="What was this for?" type="text"/>
</div>
</div>
<div class="relative group">
<label class="block text-label-sm font-label-sm text-outline mb-2 ml-1">Date</label>
<div class="glass-card rounded-xl flex items-center px-4 py-3 group-focus-within:border-primary-container transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mr-3">calendar_today</span>
<input class="bg-transparent border-none p-0 w-full text-body-md font-body-md text-on-surface focus:ring-0 [color-scheme:dark]" type="date" value="2023-10-27"/>
</div>
</div>
<!-- Optional Receipt Upload Card -->
<div class="glass-card rounded-xl p-4 flex items-center justify-between group cursor-pointer hover:bg-white/5 transition-colors">
<div class="flex items-center">
<div class="h-10 w-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-secondary mr-4">
<span class="material-symbols-outlined">receipt</span>
</div>
<div>
<p class="text-label-md font-label-md text-on-surface">Attach Receipt</p>
<p class="text-label-sm font-label-sm text-on-surface-variant">Optional JPEG or PDF</p>
</div>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</div>
</div>
</main>
<!-- Fixed Action Button -->
<footer class="fixed bottom-0 left-0 w-full p-container-padding bg-gradient-to-t from-background via-background/80 to-transparent">
<button class="w-full bg-primary-container text-on-primary-container py-4 rounded-2xl font-headline-md text-headline-md shadow-2xl shadow-primary-container/20 active:scale-95 transition-transform">
      Save Transaction
    </button>
</footer>
<script>
    // Simple toggle logic
    const expenseBtn = document.getElementById('toggle-expense');
    const incomeBtn = document.getElementById('toggle-income');

    expenseBtn.addEventListener('click', () => {
      expenseBtn.classList.add('bg-error-container', 'text-on-error-container', 'shadow-lg');
      expenseBtn.classList.remove('text-on-surface-variant');
      incomeBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'shadow-lg');
      incomeBtn.classList.add('text-on-surface-variant');
    });

    incomeBtn.addEventListener('click', () => {
      incomeBtn.classList.add('bg-secondary-container', 'text-on-secondary-container', 'shadow-lg');
      incomeBtn.classList.remove('text-on-surface-variant');
      expenseBtn.classList.remove('bg-error-container', 'text-on-error-container', 'shadow-lg');
      expenseBtn.classList.add('text-on-surface-variant');
    });

    // Category click visual feedback
    const categoryButtons = document.querySelectorAll('.flex-shrink-0.group');
    categoryButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryButtons.forEach(b => {
          const iconDiv = b.querySelector('div');
          const label = b.querySelector('span:last-child');
          iconDiv.className = 'h-14 w-14 rounded-2xl glass-card flex items-center justify-center text-on-surface-variant transition-all group-hover:bg-white/5';
          label.className = 'text-label-sm font-label-sm text-on-surface-variant';
        });
        const iconDiv = btn.querySelector('div');
        const label = btn.querySelector('span:last-child');
        iconDiv.className = 'h-14 w-14 rounded-2xl bg-primary-container/20 border border-primary-container/30 flex items-center justify-center text-primary-container transition-all scale-105';
        label.className = 'text-label-sm font-label-sm text-primary-container';
      });
    });
  </script>
</body></html>
