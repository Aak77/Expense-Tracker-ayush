<style>
        body {
            background-color: #051424;
            color: #d4e4fa;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid transparent;
            border-image: linear-gradient(to bottom right, rgba(255, 255, 255, 0.15), rgba(79, 142, 247, 0.05)) 1;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .primary-button {
            background: #4F8EF7;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .primary-button:active {
            transform: scale(0.95);
            background: #3d7ce0;
        }

        .input-glass {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s ease;
        }

        .input-glass:focus {
            border-color: #4F8EF7;
            outline: none;
            box-shadow: 0 0 0 2px rgba(79, 142, 247, 0.2);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .bg-gradient-mesh {
            background: radial-gradient(circle at 10% 20%, rgba(79, 142, 247, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(67, 222, 251, 0.05) 0%, transparent 40%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background min-h-screen flex flex-col items-center justify-center relative bg-gradient-mesh px-container-padding">
<!-- Back Navigation Shell (Back Arrow) -->
<nav class="fixed top-0 left-0 w-full z-50 flex items-center px-container-padding h-16">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-white/5 transition-colors active:scale-95 duration-200 text-primary" onclick="history.back()">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</nav>
<!-- Main Content Area: Forgot Password -->
<main class="w-full max-w-md z-10">
<!-- Brand / Identity Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary-container/20 mb-md ring-1 ring-primary-container/30">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="lock_reset" style="font-variation-settings: 'FILL' 0;">lock_reset</span>
</div>
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg text-on-surface mb-sm">Forgot Password</h1>
<p class="text-body-md font-body-md text-on-surface-variant max-w-xs mx-auto">
                No worries, it happens. Enter the email address associated with your account.
            </p>
</div>
<!-- Action Card -->
<div class="glass-card rounded-xl p-lg space-y-lg">
<form class="space-y-lg" id="resetForm" onsubmit="event.preventDefault();">
<div class="space-y-sm">
<label class="text-label-md font-label-md text-on-surface-variant block ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="mail">mail</span>
<input class="input-glass w-full h-14 pl-12 pr-4 rounded-xl text-body-md font-body-md text-on-surface placeholder:text-outline/50" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<button class="primary-button w-full h-14 rounded-xl text-label-md font-label-md font-bold text-white shadow-lg shadow-primary-container/20 flex items-center justify-center gap-2" type="submit">
                    Send Reset Link
                    <span class="material-symbols-outlined text-[20px]" data-icon="send">send</span>
</button>
</form>
</div>
<!-- Footer Help -->
<p class="text-center mt-xl text-label-md font-label-md text-on-surface-variant">
            Remembered your password? 
            <a class="text-primary font-bold hover:underline ml-1" href="#">Log In</a>
</p>
</main>
<!-- Decorative Background Elements (Glass Shards) -->
<div class="absolute top-[-10%] right-[-10%] w-[400px] h-[400px] bg-primary/10 blur-[120px] rounded-full -z-0"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[300px] h-[300px] bg-secondary/5 blur-[100px] rounded-full -z-0"></div>
<script>
        // Micro-interaction: Form Submission Feedback
        const form = document.getElementById('resetForm');
        form.addEventListener('submit', function() {
            const button = form.querySelector('button');
            const originalContent = button.innerHTML;
            
            button.disabled = true;
            button.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Sending...`;
            
            // Simulate API Call
            setTimeout(() => {
                button.classList.remove('primary-button');
                button.classList.add('bg-secondary', 'text-on-secondary-container');
                button.innerHTML = `<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Link Sent!`;
                
                // Show a brief message or redirect
                const successMsg = document.createElement('p');
                successMsg.className = 'text-center text-label-sm font-label-sm text-secondary mt-4 animate-bounce';
                successMsg.textContent = 'Please check your inbox for the reset instructions.';
                form.appendChild(successMsg);
            }, 1500);
        });

        // Hover Effect on Input
        const emailInput = document.getElementById('email');
        emailInput.addEventListener('focus', () => {
            emailInput.parentElement.querySelector('.material-symbols-outlined').style.color = '#acc7ff';
        });
        emailInput.addEventListener('blur', () => {
            emailInput.parentElement.querySelector('.material-symbols-outlined').style.color = '';
        });
    </script>
</body></html>
